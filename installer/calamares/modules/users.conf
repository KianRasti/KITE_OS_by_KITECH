---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - lp
  - video
  - network
  - storage
  - audio
  - input
  - render
  - kvm
  - name: wheel
    must_exist: false
    system: true
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
allowWeakPasswords: false
userShell: /bin/bash
