---
dontChroot: false
timeout: 120
verbose: true

i18n:
  name: "Applying HP Folio 9480m Haswell drivers and enabling KITE_OS hardware services..."

script:
  - "mkdir -p /etc/environment.d /var/lib/kitebridge /.snapshots"
  - "chmod 0755 /var/lib/kitebridge"
  - "printf 'MESA_LOADER_DRIVER_OVERRIDE=crocus\\nLIBVA_DRIVER_NAME=i965\\n' > /etc/environment.d/10-kite-haswell.conf"
  - "grep -q '^MESA_LOADER_DRIVER_OVERRIDE=crocus$' /etc/environment 2>/dev/null || echo 'MESA_LOADER_DRIVER_OVERRIDE=crocus' >> /etc/environment"
  - "grep -q '^LIBVA_DRIVER_NAME=i965$' /etc/environment 2>/dev/null || echo 'LIBVA_DRIVER_NAME=i965' >> /etc/environment"
  - "systemctl enable kite-hw-tune.service"
  - "systemctl enable kite-power.service"
  - "systemctl enable thermald.service || true"
  - "systemctl enable NetworkManager.service || true"
  - "systemctl enable bluetooth.service || true"
