---
modules-search:
  - local

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@cleanup
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - initcpiocfg
      - initcpio
      - users
      - bootloader
      - shellprocess
      - umount
  - show:
      - finished

branding: kite-os
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
