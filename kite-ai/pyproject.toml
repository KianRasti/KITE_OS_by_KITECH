[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-ai"
version = "0.1.0"
description = "Zero-idle-RAM local data mining and sub-400 token BYOK agent for KITE_OS"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kite-ai = "kite_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
