# KITE_OS Floating-First Window Rules (Windows 11 UX on Hyprland)

# Float standard desktop application windows by default and keep within 1366x768 safe bounds
windowrulev2 = float, class:.*
windowrulev2 = center, floating:1
windowrulev2 = maxsize 1280 700, floating:1

# KITE_OS Settings Studio
windowrulev2 = float, class:^(kite-settings|org\.kiteos\.settings)$
windowrulev2 = size 1020 680, class:^(kite-settings|org\.kiteos\.settings)$
windowrulev2 = center, class:^(kite-settings|org\.kiteos\.settings)$

# KiteBridge Universal Subsystem Windows ([Win] Wine, [Android] Waydroid, [macOS] OSX-KVM)
windowrulev2 = float, class:^(wine|.*\.exe)$
windowrulev2 = float, class:^(Waydroid|waydroid\..*)$
windowrulev2 = float, class:^(kite-macos-bridge|qemu-system-x86_64)$

# System dialogs & transient popups
windowrulev2 = float, title:^(Open File|Save File|Confirm|File Operation Progress)$
windowrulev2 = suppressmaximize, class:.*
