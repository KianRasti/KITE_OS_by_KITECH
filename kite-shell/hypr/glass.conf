# KITE_OS Glass Visual Defaults — Intel HD 4400 Bounded Dual-Kawase Budget
# Overridden at runtime by ~/.config/hypr/kite-glass-runtime.conf

decoration {
    rounding = 12
    active_opacity = 0.92
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = true
        ignore_opacity = true
        noise = 0.0117
        contrast = 0.95
        brightness = 1.0
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000044)
    }
}

animations {
    enabled = true
    bezier = kiteSpring, 0.22, 1.0, 0.36, 1.0
    bezier = kiteEaseOut, 0.16, 1.0, 0.3, 1.0

    animation = windows, 1, 3, kiteSpring, popin 92%
    animation = windowsOut, 1, 2, kiteEaseOut, popin 92%
    animation = border, 1, 5, default
    animation = fade, 1, 3, kiteEaseOut
    animation = workspaces, 1, 4, kiteSpring, slide
    animation = layers, 1, 3, kiteSpring, fade
}

# Quickshell Wayland Layer-Shell Blur Rules
layerrule = blur, quickshell
layerrule = ignorezero, quickshell
layerrule = ignorealpha 0.2, quickshell
