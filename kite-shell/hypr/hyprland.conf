# KITE_OS Hyprland Configuration — HP EliteBook Folio 9480m (Haswell ULT + Intel HD 4400)

# Mandatory Haswell GPU / VA-API Driver Pins
env = MESA_LOADER_DRIVER_OVERRIDE,crocus
env = LIBVA_DRIVER_NAME,i965
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Display & External Monitor Auto-Detection (eDP-1 1366x768 / 1600x900 + DP/VGA)
monitor = eDP-1, preferred, auto, 1
monitor = , preferred, auto, 1

# Synaptics LuxPad Trackpad & TrackPoint
input {
    kb_layout = us
    follow_mouse = 1
    float_switch_override_focus = 2
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = false
        disable_while_typing = true
    }
}

# General Window Layout (Floating-First default via windowrules.conf + on-demand tiling)
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(FFFFFF59) rgba(38BDF866) 45deg
    col.inactive_border = rgba(FFFFFF22)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Variable Frame Rate Damage Tracking (zero idle GPU wakeups on HD 4400)
misc {
    vfr = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

# Modular Configurations (runtime override MUST come AFTER glass.conf)
source = ~/.config/hypr/glass.conf
source = ~/.config/hypr/kite-glass-runtime.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/keybinds.conf

# Session Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP MESA_LOADER_DRIVER_OVERRIDE LIBVA_DRIVER_NAME
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = kite-settings sync --no-reload
exec-once = quickshell
