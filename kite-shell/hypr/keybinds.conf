# KITE_OS Windows 11-Aligned Keybindings & Folio 9480m Fn Controls

$mainMod = SUPER

# Windows 11 Shell Overlays & Kite AI Spotlight (Quickshell GlobalShortcuts)
bindr = $mainMod, Super_L, global, kite:toggleStartMenu
bind  = $mainMod, S, global, kite:toggleStartMenu
bind  = $mainMod, A, global, kite:toggleQuickSettings
bind  = $mainMod, N, global, kite:toggleNotifications
bind  = $mainMod, Z, global, kite:toggleSnapLayouts
bind  = $mainMod, Tab, global, kite:toggleTaskView

# Core Apps & Studio
bind = $mainMod, I, exec, kite-settings
bind = $mainMod, E, exec, dolphin
bind = $mainMod, Return, exec, foot
bind = $mainMod, T, exec, foot

# Floating-First Window & On-Demand Tiling Controls (dwindle / master)
bind = ALT, F4, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, D, togglespecialworkspace, minimized
bind = $mainMod SHIFT, T, exec, sh -c 'cur=$(hyprctl getoption general:layout -j | jq -r .str); if [ "$cur" = "dwindle" ]; then hyprctl keyword general:layout master; else hyprctl keyword general:layout dwindle; fi'

# Focus & Workspaces
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Mouse Floating Drag & Resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# HP Folio 9480m Hardware Fn Media & Brightness Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
