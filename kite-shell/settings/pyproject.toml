[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-settings"
version = "0.1.0"
description = "KITE_OS Glass UI customization controller and hardware-clamped Hyprland runtime generator"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kite-settings-cli = "kite_settings.cli:main"

[tool.setuptools.packages.find]
include = ["kite_settings*"]
