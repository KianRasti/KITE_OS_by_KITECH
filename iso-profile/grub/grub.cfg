insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod font

set default="kite-os"
set timeout=5
set timeout_style=menu

search --no-floppy --fs-uuid --set=root %ARCHISO_UUID%

menuentry "KITE_OS Live / Installer (HP Folio 9480m x86-64-v3)" --id kite-os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash i915.enable_fbc=1 i915.fastboot=1 intel_pstate=active psi=1
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "KITE_OS Live / Installer (Haswell High-Perf: mitigations=off)" --id kite-os-fast {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash i915.enable_fbc=1 i915.fastboot=1 intel_pstate=active psi=1 mitigations=off
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}
