LABEL kite-os
TEXT HELP
Boot KITE_OS (Built by KITech | kian.kitech.info) for HP EliteBook Folio 9480m (x86-64-v3).
ENDTEXT
MENU LABEL KITE_OS — Built by KITech (x86-64-v3)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash i915.enable_fbc=1 i915.fastboot=1 intel_pstate=active psi=1

LABEL kite-os-mitigations-off
TEXT HELP
Boot KITE_OS (Built by KITech) with mitigations=off for maximum Haswell IPC.
ENDTEXT
MENU LABEL KITE_OS — Built by KITech (mitigations=off)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash i915.enable_fbc=1 i915.fastboot=1 intel_pstate=active psi=1 mitigations=off
