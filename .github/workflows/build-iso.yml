name: Build KITE_OS ISO

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml jsonschema

      - name: Run repository invariant checks
        run: python scripts/check_invariants.py

      - name: Run unit and host tests
        run: python -m pytest scripts/tests

      - name: Validate Bash script syntax
        run: |
          for dir in iso-profile scripts kite-hw-tune kite-shell kite-bridge installer; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -name '*.sh' -exec bash -n {} +
            fi
          done

      - name: Validate PowerShell 5.1 script syntax
        run: |
          pwsh -NoProfile -Command 'Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object { $t=$null; $e=$null; $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e); if ($e.Count -gt 0) { throw "Parse error in $($_.FullName)" } }'

      - name: Dry-run build and QEMU scripts
        run: |
          bash scripts/build-iso.sh --dry-run --json
          for ram in 4G 8G 16G; do
            for rot in 0 1; do
              bash scripts/test-qemu.sh --dry-run --ram "$ram" --rotational "$rot" --json
            done
          done

  build-iso:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap Archiso and keyring prerequisites
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archiso git curl rsync squashfs-tools dosfstools libisoburn

      - name: Build KITE_OS ISO
        run: bash scripts/build-iso.sh --work-dir work --out-dir out

      - name: Verify ISO and SHA-256
        run: |
          ls -lh out/kite-os-folio9480-x86_64_v3.iso out/kite-os-folio9480-x86_64_v3.iso.sha256
          (cd out && sha256sum -c kite-os-folio9480-x86_64_v3.iso.sha256)

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-os-folio9480-x86_64_v3
          path: |
            out/kite-os-folio9480-x86_64_v3.iso
            out/kite-os-folio9480-x86_64_v3.iso.sha256
          if-no-files-found: error
